# Cloudflare Pages 本地联调绑定示例(仅本地开发用,不是生产配置)
#
# 重要:不要添加 pages_build_output_dir 字段。
# 按官方规则,带该字段的 Wrangler 文件随 Git 部署后会成为 Pages 项目配置的唯一来源:
# 控制台里配的 D1 绑定会被覆盖且变灰不可编辑,而本文件里的 database_id 是占位符、
# ARCHIVE 桶也尚未创建,阶段 1 会直接失效。
# 生产请在控制台配置:
#   Settings → Bindings → Add → D1 database bindings(Variable name 必须是 DB)
#   Settings → Variables and Secrets → Add(TEACHER_TOKEN / SYNC_SALT, 勾 Encrypt)
# database_id / bucket_name 换成你自己的值,不要把任何密钥写进这个文件。

name = "spider-c"
compatibility_date = "2026-11-10"

# 阶段 1:主库
[[d1_databases]]
binding = "DB"
database_name = "spider-c-learning"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 阶段 2:周快照归档(不绑定时 /api/archive 返回 503,阶段 1 完全可用)
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "spider-c-archive"

# TEACHER_TOKEN / SYNC_SALT 用 secret 设置,不要写进本文件:
#   npx wrangler pages secret put TEACHER_TOKEN
#   npx wrangler pages secret put SYNC_SALT
